plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/IngsisPrintScript/PrintScript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

dependencies {
    implementation("PrintScript:com.ingsis.engine:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.interpreter:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.lexer:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.syntactic:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.tokens:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.runtime:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.nodes:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.result:1.0.0-aa81d23")
    implementation("PrintScript:com.ingsis.result.factory:1.0.0-aa81d23")
    testImplementation 'junit:junit:4.13.1'    
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
